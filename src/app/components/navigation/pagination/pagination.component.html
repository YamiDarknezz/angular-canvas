<section class="design-section">
  <h2 class="section-title">Pagination</h2>
  <p class="section-desc">Paginación numérica, compacta y de vidrio</p>

  @if (variant(); as v) {
    <ng-container
      *ngTemplateOutlet="
        pagerNav;
        context: {
          isCompact: v === 'compact',
          isGlass: v === 'glass',
          variant: v,
        }
      "
    />
  } @else {
    <ng-container
      *ngTemplateOutlet="
        pagerNav;
        context: { isCompact: false, isGlass: false, variant: 'numbers' }
      "
    />
    <ng-container
      *ngTemplateOutlet="pagerNav; context: { isCompact: true, isGlass: false, variant: 'compact' }"
    />
    <ng-container
      *ngTemplateOutlet="pagerNav; context: { isCompact: false, isGlass: true, variant: 'glass' }"
    />
  }
</section>

<ng-template #pagerNav let-isGlass="isGlass" let-isCompact="isCompact" let-v="variant">
  <div class="pager-stage" [class.glass]="isGlass" [attr.data-variant]="v">
    <nav
      class="pager"
      [class.compact]="isCompact"
      [attr.aria-label]="isCompact ? 'Paginación compacta' : 'Paginación'"
    >
      <button
        type="button"
        class="pager-arrow"
        aria-label="Página anterior"
        [disabled]="page() === 1"
        (click)="prev()"
      >
        <svg
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
          aria-hidden="true"
        >
          <path d="m14.5 6-6 6 6 6" />
        </svg>
      </button>

      @if (isCompact) {
        <span class="pager-label"
          >Página <strong>{{ page() }}</strong> de {{ total }}</span
        >
      } @else {
        @for (item of pages(); track $index) {
          @if (item === '…') {
            <span class="pager-gap" aria-hidden="true">…</span>
          } @else {
            <button
              type="button"
              class="pager-page"
              [class.active]="page() === item"
              [attr.aria-current]="page() === item ? 'page' : null"
              [attr.aria-label]="'Página ' + item"
              (click)="go(item)"
            >
              {{ item }}
            </button>
          }
        }
      }

      <button
        type="button"
        class="pager-arrow"
        aria-label="Página siguiente"
        [disabled]="page() === total"
        (click)="next()"
      >
        <svg
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
          aria-hidden="true"
        >
          <path d="m9.5 6 6 6-6 6" />
        </svg>
      </button>
    </nav>
  </div>
</ng-template>
