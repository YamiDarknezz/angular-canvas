<section class="design-section">
  <h2 class="section-title">Pagination</h2>
  <p class="section-desc">Paginación numérica, compacta y de vidrio</p>

  <div class="pager-stage" data-variant="numbers">
    <nav class="pager" aria-label="Paginación">
      <button
        type="button"
        class="pager-arrow"
        aria-label="Página anterior"
        [disabled]="page() === 1"
        (click)="prev()"
      >
        <svg
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
          aria-hidden="true"
        >
          <path d="m14.5 6-6 6 6 6" />
        </svg>
      </button>

      @for (item of pages(); track $index) {
        @if (item === '…') {
          <span class="pager-gap" aria-hidden="true">…</span>
        } @else {
          <button
            type="button"
            class="pager-page"
            [class.active]="page() === item"
            [attr.aria-current]="page() === item ? 'page' : null"
            [attr.aria-label]="'Página ' + item"
            (click)="go(item)"
          >
            {{ item }}
          </button>
        }
      }

      <button
        type="button"
        class="pager-arrow"
        aria-label="Página siguiente"
        [disabled]="page() === total"
        (click)="next()"
      >
        <svg
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
          aria-hidden="true"
        >
          <path d="m9.5 6 6 6-6 6" />
        </svg>
      </button>
    </nav>
  </div>

  <div class="pager-stage" data-variant="compact">
    <nav class="pager compact" aria-label="Paginación compacta">
      <button
        type="button"
        class="pager-arrow"
        aria-label="Página anterior"
        [disabled]="page() === 1"
        (click)="prev()"
      >
        <svg
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
          aria-hidden="true"
        >
          <path d="m14.5 6-6 6 6 6" />
        </svg>
      </button>
      <span class="pager-label"
        >Página <strong>{{ page() }}</strong> de {{ total }}</span
      >
      <button
        type="button"
        class="pager-arrow"
        aria-label="Página siguiente"
        [disabled]="page() === total"
        (click)="next()"
      >
        <svg
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
          aria-hidden="true"
        >
          <path d="m9.5 6 6 6-6 6" />
        </svg>
      </button>
    </nav>
  </div>

  <div class="pager-stage glass" data-variant="glass">
    <nav class="pager" aria-label="Paginación de vidrio">
      <button
        type="button"
        class="pager-arrow"
        aria-label="Página anterior"
        [disabled]="page() === 1"
        (click)="prev()"
      >
        <svg
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
          aria-hidden="true"
        >
          <path d="m14.5 6-6 6 6 6" />
        </svg>
      </button>

      @for (item of pages(); track $index) {
        @if (item === '…') {
          <span class="pager-gap" aria-hidden="true">…</span>
        } @else {
          <button
            type="button"
            class="pager-page"
            [class.active]="page() === item"
            [attr.aria-current]="page() === item ? 'page' : null"
            [attr.aria-label]="'Página ' + item"
            (click)="go(item)"
          >
            {{ item }}
          </button>
        }
      }

      <button
        type="button"
        class="pager-arrow"
        aria-label="Página siguiente"
        [disabled]="page() === total"
        (click)="next()"
      >
        <svg
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
          aria-hidden="true"
        >
          <path d="m9.5 6 6 6-6 6" />
        </svg>
      </button>
    </nav>
  </div>
</section>
