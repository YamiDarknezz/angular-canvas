<section class="design-section">
  <h2 class="section-title">Sidebar Navigation</h2>
  <p class="section-desc">Navegación lateral colapsable</p>
  <div class="sidebar-demo">
    <nav class="sidebar" [class.collapsed]="collapsed()">
      <div class="sidebar-header">
        <span class="logo" *ngIf="!collapsed()">🎨 Canvas</span>
        <span class="logo-mini" *ngIf="collapsed()">🎨</span>
        <button class="toggle-btn" (click)="toggle()">☰</button>
      </div>
      <ul class="menu">
        <li *ngFor="let item of menuItems"
            [class.active]="activeItem() === item.id"
            (click)="setActive(item.id)">
          <span class="menu-icon">{{ item.icon }}</span>
          <span class="menu-label" *ngIf="!collapsed()">{{ item.label }}</span>
        </li>
      </ul>
    </nav>
    <div class="sidebar-preview">
      <p>Click ☰ para colapsar/expandir</p>
    </div>
  </div>
</section>
