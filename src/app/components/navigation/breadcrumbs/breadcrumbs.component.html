<section class="design-section">
  <h2 class="section-title">Breadcrumbs</h2>
  <p class="section-desc">Migas de pan con chevron, slash y acabado de vidrio</p>

  @if (variant(); as v) {
    <ng-container
      *ngTemplateOutlet="
        crumbsTpl;
        context: {
          styleClass: v === 'slash' ? 'mono' : v === 'glass' ? 'glass' : '',
          isSlash: v === 'slash',
          variant: v,
        }
      "
    />
  } @else {
    <ng-container
      *ngTemplateOutlet="crumbsTpl; context: { styleClass: '', isSlash: false, variant: 'chevron' }"
    />
    <ng-container
      *ngTemplateOutlet="
        crumbsTpl;
        context: { styleClass: 'mono', isSlash: true, variant: 'slash' }
      "
    />
    <ng-container
      *ngTemplateOutlet="
        crumbsTpl;
        context: { styleClass: 'glass', isSlash: false, variant: 'glass' }
      "
    />
  }
</section>

<ng-template #crumbsTpl let-styleClass="styleClass" let-isSlash="isSlash" let-v="variant">
  <div class="crumbs-stage" [class]="styleClass" [attr.data-variant]="v">
    <nav class="crumbs" aria-label="Ruta de navegación">
      @for (crumb of crumbs; track crumb; let last = $last) {
        <button
          type="button"
          class="crumb"
          [class.current]="last"
          [attr.aria-current]="last ? 'page' : null"
        >
          {{ crumb }}
        </button>
        @if (!last) {
          @if (isSlash) {
            <span class="crumb-sep" aria-hidden="true">/</span>
          } @else {
            <svg
              class="crumb-sep"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
              aria-hidden="true"
            >
              <path d="m9.5 6 6 6-6 6" />
            </svg>
          }
        }
      }
    </nav>
  </div>
</ng-template>
