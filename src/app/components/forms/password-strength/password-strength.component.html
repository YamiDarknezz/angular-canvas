<section
  class="panel"
  [class.compact]="variant() === 'compact'"
  aria-label="Requisitos de contraseña"
>
  <label class="field">
    <span>{{ label() }}</span>
    <input
      #password
      [type]="visible() ? 'text' : 'password'"
      autocomplete="new-password"
      placeholder="Escribe una contraseña"
      (input)="onInput(password.value)"
    />
  </label>
  <button class="visibility" type="button" (click)="visible.set(!visible())">
    {{ visible() ? 'Ocultar contraseña' : 'Ver contraseña' }}
  </button>

  <div class="meter">
    <p>
      Requisitos cumplidos
      <strong role="status">{{ completed() }} de {{ criteria().length }}</strong>
    </p>
    <div class="segments" aria-hidden="true">
      @for (criterion of criteria(); track criterion.label; let index = $index) {
        <span [class.filled]="index < completed()"></span>
      }
    </div>
  </div>
  <ul class="criteria">
    @for (criterion of criteria(); track criterion.label) {
      <li [class.met]="criterion.met">
        <span class="mark" aria-hidden="true"></span>
        <span class="sr-only">{{ criterion.met ? 'Cumplido. ' : 'Pendiente. ' }}</span>
        {{ criterion.label }}
      </li>
    }
  </ul>
</section>
