<section class="design-section">
  <h2 class="section-title">Custom Checkboxes</h2>
  <p class="section-desc">Checkboxes personalizados y accesibles</p>
  <div class="checkbox-showcase" data-variant="default">
    @for (item of items; track item.id) {
      <button
        type="button"
        class="checkbox-item"
        role="checkbox"
        [attr.aria-checked]="item.checked()"
        (click)="toggle(item)"
      >
        <span class="custom-checkbox" [class.checked]="item.checked()">
          <svg viewBox="0 0 24 24" class="check-icon" aria-hidden="true">
            <polyline
              points="20 6 9 17 4 12"
              fill="none"
              stroke="currentColor"
              stroke-width="3"
              stroke-linecap="round"
              stroke-linejoin="round"
            />
          </svg>
        </span>
        <span class="checkbox-label">{{ item.label }}</span>
      </button>
    }
  </div>
</section>
