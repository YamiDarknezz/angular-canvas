<section class="design-section">
  <h2 class="section-title">Glass Form Inputs</h2>
  <p class="section-desc">Inputs con estilo glassmorphism</p>
  <div class="form-container">
    <div class="glass-form">
      <div class="form-group">
        <input type="text" id="name" [(ngModel)]="name" placeholder=" " required />
        <label for="name">Nombre</label>
        <div class="input-highlight"></div>
      </div>
      <div class="form-group">
        <input type="email" id="email" [(ngModel)]="email" placeholder=" " required />
        <label for="email">Email</label>
        <div class="input-highlight"></div>
      </div>
      <div class="form-group">
        <textarea id="message" [(ngModel)]="message" placeholder=" " rows="3"></textarea>
        <label for="message">Mensaje</label>
        <div class="input-highlight"></div>
      </div>
      <button type="button" class="glass-submit">Enviar →</button>
    </div>
  </div>
</section>
