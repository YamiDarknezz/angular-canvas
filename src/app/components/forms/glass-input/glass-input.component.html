<section class="design-section">
  <h2 class="section-title">Glass Form Inputs</h2>
  <p class="section-desc">Inputs con estilo glassmorphism</p>
  <div class="form-container" data-variant="default">
    <div class="glass-form">
      <div class="form-group">
        <input
          type="text"
          [attr.id]="instanceId + '-name'"
          [(ngModel)]="name"
          placeholder=" "
          required
        />
        <label [attr.for]="instanceId + '-name'">Nombre</label>
        <div class="input-highlight"></div>
      </div>
      <div class="form-group">
        <input
          type="email"
          [attr.id]="instanceId + '-email'"
          [(ngModel)]="email"
          placeholder=" "
          required
        />
        <label [attr.for]="instanceId + '-email'">Email</label>
        <div class="input-highlight"></div>
      </div>
      <div class="form-group">
        <textarea
          [attr.id]="instanceId + '-message'"
          [(ngModel)]="message"
          placeholder=" "
          rows="3"
        ></textarea>
        <label [attr.for]="instanceId + '-message'">Mensaje</label>
        <div class="input-highlight"></div>
      </div>
      <button type="button" class="glass-submit">Enviar →</button>
    </div>
  </div>
</section>
