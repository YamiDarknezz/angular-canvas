<section class="design-section">
  <h2 class="section-title">Aurora Backgrounds</h2>
  <p class="section-desc">Blobs de color en movimiento, haces de luz y vidrio sobre aurora</p>

  <div class="aurora-stage" data-variant="aurora">
    <span class="orb orb-1" aria-hidden="true"></span>
    <span class="orb orb-2" aria-hidden="true"></span>
    <span class="orb orb-3" aria-hidden="true"></span>
    <p class="aurora-copy">Aurora boreal</p>
  </div>

  <div class="aurora-stage" data-variant="beams">
    <span class="beam beam-1" aria-hidden="true"></span>
    <span class="beam beam-2" aria-hidden="true"></span>
    <span class="beam beam-3" aria-hidden="true"></span>
    <p class="aurora-copy">Haces de luz</p>
  </div>

  <div class="aurora-stage" data-variant="glass">
    <span class="orb orb-1" aria-hidden="true"></span>
    <span class="orb orb-2" aria-hidden="true"></span>
    <article class="aurora-panel">
      <h3>Vidrio sobre aurora</h3>
      <p>Un panel translúcido deja pasar el color y el movimiento del fondo.</p>
      <button type="button" class="aurora-btn">Explorar</button>
    </article>
  </div>
</section>
