<section class="comparison" [attr.data-variant]="mode()" [style.--compare-accent]="accent()">
  <div class="labels">
    <span><strong>Antes</strong> · Estructura</span>
    <span><strong>Después</strong> · Acabado</span>
  </div>

  <div
    class="viewport"
    [class.draggable]="mode() === 'split'"
    [style.--position]="position() + '%'"
    (pointerdown)="startDrag($event)"
    (pointermove)="drag($event)"
    (lostpointercapture)="stopDrag($event)"
    aria-hidden="true"
  >
    @for (state of ['before', 'after']; track state) {
      <div
        class="layer"
        [class.before]="state === 'before'"
        [class.after]="state === 'after'"
        [class.reveal]="state === 'after' && mode() !== 'fade'"
        [style.opacity]="state === 'after' && mode() === 'fade' ? position() / 100 : null"
      >
        <div class="assembly">
          @for (height of pieces; track $index) {
            <div class="piece" [style.--height]="height + 'px'">
              <span class="face top"></span>
              <span class="face front"></span>
              <span class="face right"></span>
            </div>
          }
        </div>
      </div>
    }

    @if (mode() !== 'fade') {
      <div class="divider" [class.beam]="mode() === 'scanner'">
        @if (mode() === 'split') {
          <span class="handle"></span>
        }
      </div>
    }
  </div>

  <div class="controls">
    <label>
      <span>{{ mode() === 'fade' ? 'Acabado visible' : 'Posición del divisor' }}</span>
      <input
        #range
        type="range"
        min="0"
        max="100"
        [value]="position()"
        (input)="scrub(range.valueAsNumber)"
      />
    </label>
    @if (mode() === 'scanner' && animate() !== false) {
      <button type="button" (click)="toggleScanner()">
        {{ scanning() ? 'Pausar barrido' : 'Iniciar barrido' }}
      </button>
    }
  </div>
</section>
