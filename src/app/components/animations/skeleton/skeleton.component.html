<section class="design-section">
  <h2 class="section-title">Skeleton Loading</h2>
  <p class="section-desc">Shimmer, pulso y onda para estados de carga</p>

  @if (variant(); as v) {
    <ng-container *ngTemplateOutlet="skelTpl; context: { effect: v, variant: v }" />
  } @else {
    <ng-container *ngTemplateOutlet="skelTpl; context: { effect: 'shimmer', variant: 'shimmer' }" />
    <ng-container *ngTemplateOutlet="skelTpl; context: { effect: 'pulse', variant: 'pulse' }" />
    <ng-container *ngTemplateOutlet="skelTpl; context: { effect: 'wave', variant: 'wave' }" />
  }
</section>

<ng-template #skelTpl let-effect="effect" let-v="variant">
  <div class="skel-stage" [attr.data-variant]="v">
    <div class="skel-card" [class]="effect">
      <div class="skel-avatar"></div>
      <div class="skel-lines">
        <div class="skel-line w80"></div>
        <div class="skel-line w60"></div>
        <div class="skel-line w90"></div>
      </div>
      <div class="skel-footer">
        <div class="skel-btn"></div>
        <div class="skel-btn w40"></div>
      </div>
    </div>
  </div>
</ng-template>
