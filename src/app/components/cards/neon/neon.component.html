<section class="design-section">
  <h2 class="section-title">Neon Cards</h2>
  <p class="section-desc">Bordes luminosos con efecto de neón brillante</p>
  <div class="card-grid">
    <div
      class="neon-card neon-blue"
      data-variant="blue"
      [style.display]="this.variant() && this.variant() !== 'blue' ? 'none' : null"
    >
      <div class="neon-border"></div>
      <h3>Neón Azul</h3>
      <p>El clásico neón que nunca falla. Ideal para interfaces tech y gaming.</p>
    </div>
    <div
      class="neon-card neon-pink"
      data-variant="pink"
      [style.display]="this.variant() && this.variant() !== 'pink' ? 'none' : null"
    >
      <div class="neon-border"></div>
      <h3>Neón Rosa</h3>
      <p>Energía vibrante para dashboards y apps de entretenimiento.</p>
    </div>
    <div
      class="neon-card neon-green"
      data-variant="green"
      [style.display]="this.variant() && this.variant() !== 'green' ? 'none' : null"
    >
      <div class="neon-border"></div>
      <h3>Neón Verde</h3>
      <p>Inspiración Matrix. Perfecto para terminales y herramientas dev.</p>
    </div>
  </div>
</section>
