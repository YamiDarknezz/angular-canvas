<section class="design-section">
  <h2 class="section-title">Glow Text</h2>
  <p class="section-desc">Texto con efecto de neón brillante</p>
  <div class="text-showcase">
    <h3
      class="glow-text glow-cyan"
      data-variant="cyan"
      [style.display]="this.variant() && this.variant() !== 'cyan' ? 'none' : null"
    >
      Texto Cyan Neon
    </h3>
    <h3
      class="glow-text glow-pink"
      data-variant="pink"
      [style.display]="this.variant() && this.variant() !== 'pink' ? 'none' : null"
    >
      Texto Rosa Neon
    </h3>
    <h3
      class="glow-text glow-green"
      data-variant="green"
      [style.display]="this.variant() && this.variant() !== 'green' ? 'none' : null"
    >
      Texto Verde Matrix
    </h3>
    <h3
      class="glow-text glow-pulse"
      data-variant="pulse"
      [style.display]="this.variant() && this.variant() !== 'pulse' ? 'none' : null"
    >
      Texto con Pulso
    </h3>
  </div>
</section>
