<section class="design-section">
  <h2 class="section-title">3D Text</h2>
  <p class="section-desc">Extrusión por capas, perspectiva isométrica y levitación</p>

  <div class="text3d-stage">
    @let v = variant() || 'extrude';
    @switch (v) {
      @case ('isometric') {
        <p class="t3d isometric" data-variant="isometric">Isométrico</p>
      }
      @case ('floating') {
        <p class="t3d floating" data-variant="floating">Floating</p>
      }
      @default {
        <p class="t3d extrude" data-variant="extrude">EXTRUDE</p>
      }
    }
  </div>
</section>
