<section class="design-section">
  <h2 class="section-title">Gradient Text</h2>
  <p class="section-desc">Texto con degradados animados y estáticos</p>
  <div class="text-showcase">
    <h3
      class="grad-text grad-static"
      data-variant="static"
      [style.display]="this.variant() && this.variant() !== 'static' ? 'none' : null"
    >
      Texto con Degradado Estático
    </h3>
    <h3
      class="grad-text grad-animated"
      data-variant="animated"
      [style.display]="this.variant() && this.variant() !== 'animated' ? 'none' : null"
    >
      Texto con Degradado Animado
    </h3>
    <h3
      class="grad-text grad-rainbow"
      data-variant="rainbow"
      [style.display]="this.variant() && this.variant() !== 'rainbow' ? 'none' : null"
    >
      Arcoíris Infinito
    </h3>
    <p
      class="grad-text grad-subtle"
      data-variant="subtle"
      [style.display]="this.variant() && this.variant() !== 'subtle' ? 'none' : null"
    >
      Texto sutil con degradado para párrafos largos que necesitan un toque de color sin ser
      invasivos.
    </p>
  </div>
</section>
