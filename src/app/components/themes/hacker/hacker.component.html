<section class="design-section">
  <h2 class="section-title">Hacker Theme</h2>
  <p class="section-desc">Estilo Matrix / terminal verde sobre negro</p>
  <div class="hacker-palette">
    <div class="hacker-terminal" data-variant="terminal">
      <div class="term-header">
        <span class="term-dot"></span>
        <span class="term-dot"></span>
        <span class="term-dot"></span>
        <span class="term-title">root@darknezz:~#</span>
      </div>
      <div class="term-body">
        <p class="hacker-line">$ ssh root@darknezz.dev</p>
        <p class="hacker-line blink-cursor">Password: ****</p>
        <p class="hacker-line accent">Access granted. Welcome back.</p>
        <p class="hacker-line">$ ./deploy.sh --production</p>
        <p class="hacker-line dim">Deploying to production...</p>
        <p class="hacker-line success">✓ Deploy successful!</p>
      </div>
    </div>
    <div class="palette-row" data-variant="palette">
      <div class="swatch" style="background: #000000"><span>#000000</span></div>
      <div class="swatch" style="background: #0d1117"><span>#0d1117</span></div>
      <div class="swatch" style="background: #00ff41"><span>#00ff41</span></div>
      <div class="swatch" style="background: #00cc33"><span>#00cc33</span></div>
      <div class="swatch" style="background: #39ff14"><span>#39ff14</span></div>
    </div>
  </div>
</section>
