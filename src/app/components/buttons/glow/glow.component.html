<section class="design-section">
  <h2 class="section-title">Glow Buttons</h2>
  <p class="section-desc">Botones con efecto de brillo expansivo</p>
  <div class="btn-showcase">
    <button
      type="button"
      class="glow-btn glow-blue"
      data-variant="blue"
      [style.display]="this.variant() && this.variant() !== 'blue' ? 'none' : null"
    >
      Glow Azul
    </button>
    <button
      type="button"
      class="glow-btn glow-purple"
      data-variant="purple"
      [style.display]="this.variant() && this.variant() !== 'purple' ? 'none' : null"
    >
      Glow Púrpura
    </button>
    <button
      type="button"
      class="glow-btn glow-pink"
      data-variant="pink"
      [style.display]="this.variant() && this.variant() !== 'pink' ? 'none' : null"
    >
      Glow Rosa
    </button>
    <button
      type="button"
      class="glow-btn glow-green"
      data-variant="green"
      [style.display]="this.variant() && this.variant() !== 'green' ? 'none' : null"
    >
      Glow Verde
    </button>
    <button
      type="button"
      class="glow-btn glow-orange"
      data-variant="orange"
      [style.display]="this.variant() && this.variant() !== 'orange' ? 'none' : null"
    >
      Glow Naranja
    </button>
  </div>
</section>
