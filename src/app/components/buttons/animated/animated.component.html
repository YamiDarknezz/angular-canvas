<section class="design-section">
  <h2 class="section-title">Animated Buttons</h2>
  <p class="section-desc">Botones con animaciones al interactuar</p>
  <div class="btn-showcase">
    <button type="button" class="anim-btn btn-ripple" data-variant="ripple">Ripple</button>
    <button type="button" class="anim-btn btn-pulse" data-variant="pulse">Pulse</button>
    <button type="button" class="anim-btn btn-shake" data-variant="shake">Shake</button>
    <button type="button" class="anim-btn btn-fill-up" data-variant="fill-up">Fill Up</button>
    <button type="button" class="anim-btn btn-slide-bg" data-variant="slide-bg">Slide BG</button>
    <button type="button" class="anim-btn btn-magnetic" data-variant="magnetic">Magnetic</button>
  </div>
</section>
