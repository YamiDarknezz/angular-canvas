<section class="design-section">
  <h2 class="section-title">Animated Buttons</h2>
  <p class="section-desc">Botones con animaciones al interactuar</p>
  <div class="btn-showcase">
    <button
      type="button"
      class="anim-btn btn-ripple"
      data-variant="ripple"
      [style.display]="this.variant() && this.variant() !== 'ripple' ? 'none' : null"
    >
      Ripple
    </button>
    <button
      type="button"
      class="anim-btn btn-pulse"
      data-variant="pulse"
      [style.display]="this.variant() && this.variant() !== 'pulse' ? 'none' : null"
    >
      Pulse
    </button>
    <button
      type="button"
      class="anim-btn btn-shake"
      data-variant="shake"
      [style.display]="this.variant() && this.variant() !== 'shake' ? 'none' : null"
    >
      Shake
    </button>
    <button
      type="button"
      class="anim-btn btn-fill-up"
      data-variant="fill-up"
      [style.display]="this.variant() && this.variant() !== 'fill-up' ? 'none' : null"
    >
      Fill Up
    </button>
    <button
      type="button"
      class="anim-btn btn-slide-bg"
      data-variant="slide-bg"
      [style.display]="this.variant() && this.variant() !== 'slide-bg' ? 'none' : null"
    >
      Slide BG
    </button>
    <button
      type="button"
      class="anim-btn btn-magnetic"
      data-variant="magnetic"
      [style.display]="this.variant() && this.variant() !== 'magnetic' ? 'none' : null"
    >
      Magnetic
    </button>
  </div>
</section>
