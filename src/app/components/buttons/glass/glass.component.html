<section class="design-section">
  <h2 class="section-title">Glass Buttons</h2>
  <p class="section-desc">Botones translúcidos con blur, brillo interior y borde degradado</p>

  <div class="gbtn-stage">
    <span class="stage-orb orb-a" aria-hidden="true"></span>
    <span class="stage-orb orb-b" aria-hidden="true"></span>

    @if (!variant() || variant() === 'glass') {
      <button type="button" class="gbtn" data-variant="glass">Glass</button>
    }
    @if (!variant() || variant() === 'frost') {
      <button type="button" class="gbtn frost" data-variant="frost">Frost</button>
    }
    @if (!variant() || variant() === 'gradient-border') {
      <button type="button" class="gbtn border-grad" data-variant="gradient-border">
        Borde degradado
      </button>
    }
  </div>
</section>
