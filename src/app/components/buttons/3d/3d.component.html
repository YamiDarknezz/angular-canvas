<section class="design-section">
  <h2 class="section-title">3D Buttons</h2>
  <p class="section-desc">Relieve, volteo y levitación con sombras en tres dimensiones</p>

  <div class="btn3d-stage">
    @let v = variant() || 'push';
    @switch (v) {
      @case ('flip') {
        <button type="button" class="btn3d flip" data-variant="flip">
          <span class="flip-inner">
            <span class="flip-face front">3D Flip</span>
            <span class="flip-face back">¡Acción!</span>
          </span>
        </button>
      }
      @case ('levitate') {
        <button type="button" class="btn3d levitate" data-variant="levitate">Levitación</button>
      }
      @default {
        <button type="button" class="btn3d push" data-variant="push">Presióname</button>
      }
    }
  </div>
</section>
