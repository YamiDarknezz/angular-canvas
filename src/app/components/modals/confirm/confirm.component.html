<section class="design-section">
  <h2 class="section-title">Confirm Dialog</h2>
  <p class="section-desc">Diálogo de confirmación con variantes de peligro y vidrio</p>

  @if (variant(); as v) {
    <ng-container
      *ngTemplateOutlet="
        confirmTpl;
        context: {
          key: v,
          isDanger: v === 'danger',
          label: v === 'danger' ? 'Eliminar proyecto' : 'Publicar cambios',
          title: v === 'danger' ? 'Eliminar este proyecto' : 'Publicar cambios',
          desc:
            v === 'danger'
              ? 'Esta acción no se puede deshacer. Se eliminarán todos los archivos, historial y configuración del proyecto permanentemente.'
              : 'Los cambios estarán visibles para todos los usuarios del proyecto. ¿Estás seguro de que quieres continuar?',
          actionLabel: v === 'danger' ? 'Eliminar' : 'Publicar',
          actionClass: v === 'danger' ? 'danger' : 'primary',
        }
      "
    />
  } @else {
    <ng-container
      *ngTemplateOutlet="
        confirmTpl;
        context: {
          key: 'danger',
          isDanger: true,
          label: 'Eliminar proyecto',
          title: 'Eliminar este proyecto',
          desc: 'Esta acción no se puede deshacer. Se eliminarán todos los archivos, historial y configuración del proyecto permanentemente.',
          actionLabel: 'Eliminar',
          actionClass: 'danger',
        }
      "
    />
    <ng-container
      *ngTemplateOutlet="
        confirmTpl;
        context: {
          key: 'glass',
          isDanger: false,
          label: 'Publicar cambios',
          title: 'Publicar cambios',
          desc: 'Los cambios estarán visibles para todos los usuarios del proyecto. ¿Estás seguro de que quieres continuar?',
          actionLabel: 'Publicar',
          actionClass: 'primary',
        }
      "
    />
  }
</section>

<ng-template
  #confirmTpl
  let-key="key"
  let-isDanger="isDanger"
  let-label="label"
  let-title="title"
  let-desc="desc"
  let-actionLabel="actionLabel"
  let-actionClass="actionClass"
>
  <div class="confirm-stage" [attr.data-variant]="key">
    <button
      type="button"
      class="confirm-trigger"
      [class.danger]="isDanger"
      [class.glass]="!isDanger"
      (click)="show(key)"
    >
      <svg
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="1.8"
        stroke-linecap="round"
        stroke-linejoin="round"
        aria-hidden="true"
      >
        @if (isDanger) {
          <path
            d="M12 9v4m0 4h.01M10.29 3.86 1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"
          />
        } @else {
          <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z" />
        }
      </svg>
      {{ label }}
    </button>
    @if (confirmed() === key) {
      <p class="confirm-done">
        {{ isDanger ? 'Eliminado ✓' : 'Publicado ✓' }}
      </p>
    }
  </div>

  @if (open() === key) {
    <div class="confirm-overlay" (click)="close()">
      <div
        class="confirm-dialog"
        [class.glass]="!isDanger"
        role="alertdialog"
        aria-modal="true"
        [attr.aria-labelledby]="key + '-title'"
        [attr.aria-describedby]="key + '-desc'"
        (click)="$event.stopPropagation()"
      >
        <div class="confirm-icon" [class.danger-icon]="isDanger" [class.glass-icon]="!isDanger">
          <svg
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="1.8"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            @if (isDanger) {
              <path
                d="M12 9v4m0 4h.01M10.29 3.86 1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"
              />
            } @else {
              <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z" />
            }
          </svg>
        </div>
        <h3 [id]="key + '-title'" class="confirm-title">{{ title }}</h3>
        <p [id]="key + '-desc'" class="confirm-text">{{ desc }}</p>
        <div class="confirm-actions">
          <button type="button" class="confirm-btn secondary" (click)="close()">Cancelar</button>
          <button type="button" class="confirm-btn" [class]="actionClass" (click)="confirm(key)">
            {{ actionLabel }}
          </button>
        </div>
      </div>
    </div>
  }
</ng-template>
