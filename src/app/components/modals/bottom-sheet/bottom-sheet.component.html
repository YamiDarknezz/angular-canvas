<section class="design-section">
  <h2 class="section-title">Bottom Sheet</h2>
  <p class="section-desc">Panel inferior con manija y variantes sólida y de vidrio</p>

  <div class="sheet-stage" data-variant="solid">
    <button type="button" class="sheet-trigger" (click)="show('solid')">Compartir</button>
    @if (confirmed() === 'solid') {
      <p class="sheet-done">Compartido: {{ confirmed() }} ✓</p>
    }
  </div>

  @if (open() === 'solid') {
    <div class="sheet-overlay" (click)="close()">
      <div
        class="sheet"
        role="dialog"
        aria-modal="true"
        aria-label="Compartir enlace"
        (click)="$event.stopPropagation()"
      >
        <div class="sheet-handle" aria-hidden="true"></div>
        <h3 class="sheet-title">Compartir enlace</h3>
        <ul class="sheet-list">
          <li>
            <button type="button" class="sheet-option" (click)="select('Copiado')">
              Copiar enlace
            </button>
          </li>
          <li>
            <button type="button" class="sheet-option" (click)="select('Email')">
              Enviar por email
            </button>
          </li>
          <li>
            <button type="button" class="sheet-option" (click)="select('QR')">
              Generar código QR
            </button>
          </li>
          <li>
            <button type="button" class="sheet-option" (click)="select('Twitter')">
              Compartir en X
            </button>
          </li>
        </ul>
        <button type="button" class="sheet-cancel" (click)="close()">Cancelar</button>
      </div>
    </div>
  }

  <div class="sheet-stage" data-variant="glass">
    <button type="button" class="sheet-trigger glass" (click)="show('glass')">
      Agregar imagen
    </button>
    @if (confirmed() === 'glass') {
      <p class="sheet-done">{{ confirmed() }} ✓</p>
    }
  </div>

  @if (open() === 'glass') {
    <div class="sheet-overlay" (click)="close()">
      <div
        class="sheet glass"
        role="dialog"
        aria-modal="true"
        aria-label="Agregar imagen"
        (click)="$event.stopPropagation()"
      >
        <div class="sheet-handle" aria-hidden="true"></div>
        <h3 class="sheet-title">Agregar imagen</h3>
        <ul class="sheet-list">
          <li>
            <button type="button" class="sheet-option" (click)="select('Galería')">
              Galería de fotos
            </button>
          </li>
          <li>
            <button type="button" class="sheet-option" (click)="select('Cámara')">
              Tomar foto
            </button>
          </li>
          <li>
            <button type="button" class="sheet-option" (click)="select('Archivo')">
              Elegir archivo
            </button>
          </li>
        </ul>
        <button type="button" class="sheet-cancel" (click)="close()">Cancelar</button>
      </div>
    </div>
  }
</section>
