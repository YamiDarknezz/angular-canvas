<section class="design-section" data-variant="default">
  <h2 class="section-title">Glass Modal</h2>
  <p class="section-desc">
    Modal glassmorphism con foco gestionado, Escape y cierre por click fuera
  </p>
  <button type="button" class="modal-trigger" (click)="open()">Abrir Modal Glass</button>
</section>

<div
  class="modal-overlay"
  [class.visible]="isOpen()"
  [attr.inert]="isOpen() ? null : ''"
  (click)="close()"
>
  <div
    #modalPanel
    class="glass-modal"
    role="dialog"
    aria-modal="true"
    aria-labelledby="glass-modal-title"
    (click)="$event.stopPropagation()"
  >
    <button
      #closeButton
      type="button"
      class="modal-close"
      aria-label="Cerrar modal"
      (click)="close()"
    >
      ✕
    </button>
    <div class="modal-icon" aria-hidden="true">✨</div>
    <h3 id="glass-modal-title">Modal Glassmorphism</h3>
    <p>
      Este modal tiene un efecto de vidrio esmerilado con blur y transparencia. Se cierra con
      Escape, con el botón ✕ o haciendo click fuera.
    </p>
    <div class="modal-actions">
      <button type="button" class="modal-btn secondary" (click)="close()">Cancelar</button>
      <button type="button" class="modal-btn primary" (click)="close()">Confirmar</button>
    </div>
  </div>
</div>
