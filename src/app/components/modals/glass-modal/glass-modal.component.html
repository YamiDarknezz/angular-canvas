<section class="design-section">
  <h2 class="section-title">Glass Modal</h2>
  <p class="section-desc">Modal con efecto glassmorphism y animación de entrada</p>
  <button class="modal-trigger" (click)="open()">Abrir Modal Glass</button>
</section>

<div class="modal-overlay" [class.visible]="isOpen()" (click)="close()">
  <div class="glass-modal" (click)="$event.stopPropagation()">
    <button class="modal-close" (click)="close()">✕</button>
    <div class="modal-icon">✨</div>
    <h3>Modal Glassmorphism</h3>
    <p>Este modal tiene un efecto de vidrio esmerilado con blur y transparencia. Click fuera para cerrar.</p>
    <div class="modal-actions">
      <button class="modal-btn secondary" (click)="close()">Cancelar</button>
      <button class="modal-btn primary" (click)="close()">Confirmar</button>
    </div>
  </div>
</div>
