<section class="design-section" data-variant="default">
  <h2 class="section-title">Slide-in Panel</h2>
  <p class="section-desc">Panel lateral con animación de entrada, Escape y foco gestionado</p>
  <button type="button" class="slide-trigger" (click)="open()">Abrir Panel →</button>
</section>

<div
  class="slide-overlay"
  [class.visible]="isOpen()"
  [attr.inert]="isOpen() ? null : ''"
  (click)="close()"
>
  <aside
    class="slide-panel"
    role="dialog"
    aria-modal="true"
    aria-labelledby="slide-panel-title"
    (click)="$event.stopPropagation()"
  >
    <header class="slide-header">
      <h3 id="slide-panel-title">Panel Lateral</h3>
      <button
        #closeButton
        type="button"
        class="slide-close"
        aria-label="Cerrar panel"
        (click)="close()"
      >
        ✕
      </button>
    </header>
    <div class="slide-body">
      <p>Este panel se desliza desde el derecho con una transición suave.</p>
      <p>Ideal para configuraciones, detalles, o formularios secundarios.</p>
      <div class="slide-content-placeholder">
        @for (i of placeholders; track i) {
          <div class="placeholder-item">
            <div class="placeholder-icon" aria-hidden="true">📄</div>
            <div class="placeholder-text">
              <div class="placeholder-line"></div>
              <div class="placeholder-line short"></div>
            </div>
          </div>
        }
      </div>
    </div>
    <footer class="slide-footer">
      <button type="button" class="slide-btn" (click)="close()">Cerrar</button>
    </footer>
  </aside>
</div>
